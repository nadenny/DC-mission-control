<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DC Email Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Epilogue:wght@300;400;500&family=Inconsolata:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E0E0F;
  --surface: #161618;
  --surface2: #1E1E21;
  --surface3: #26262A;
  --ink: #F0EDE8;
  --ink2: #A09890;
  --ink3: #6A6260;
  --rule: #2E2E32;
  --accent: #E8A86A;
  --accent-dim: rgba(232,168,106,0.12);
  --accent-border: rgba(232,168,106,0.3);
  --green: #6EC99A;
  --green-dim: rgba(110,201,154,0.1);
  --blue: #7AB5E8;
  --blue-dim: rgba(122,181,232,0.1);
  --rose: #E87A9A;
  --rose-dim: rgba(232,122,154,0.1);
  --sand: #C8B89A;
  --sand-dim: rgba(200,184,154,0.1);
}

*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px}

body {
  font-family:'Epilogue',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ── Sidebar ── */
.layout {
  display:flex;
  min-height:100vh;
}

aside {
  width:260px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--rule);
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}

.aside-header {
  padding:1.75rem 1.5rem 1.25rem;
  border-bottom:1px solid var(--rule);
}

.back-link {
  display:inline-flex; align-items:center; gap:5px;
  font-family:'Inconsolata',monospace; font-size:10px;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); text-decoration:none;
  padding:4px 10px; border:1px solid var(--rule);
  border-radius:4px; margin-bottom:12px; transition:all .15s;
}
.back-link:hover { color:var(--accent); border-color:var(--accent-border); }

.aside-wordmark {
  font-family:'Inconsolata',monospace;
  font-size:10px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:6px;
}

.aside-title {
  font-family:'Playfair Display',serif;
  font-size:18px;
  font-weight:400;
  color:var(--ink);
  line-height:1.2;
}

.aside-title em {
  font-style:italic;
  color:var(--accent);
}

.cat-group {
  padding:.75rem 0;
  border-bottom:1px solid var(--rule);
}

.cat-label {
  font-family:'Inconsolata',monospace;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink3);
  padding:0 1.5rem .5rem;
}

.nav-item {
  display:flex;
  align-items:center;
  gap:10px;
  padding:.55rem 1.5rem;
  cursor:pointer;
  transition:background .12s;
  border-left:2px solid transparent;
}

.nav-item:hover { background:var(--surface2); }

.nav-item.active {
  background:var(--accent-dim);
  border-left-color:var(--accent);
}

.nav-dot {
  width:7px;height:7px;
  border-radius:50%;
  flex-shrink:0;
}

.nav-text {
  font-size:13px;
  color:var(--ink2);
  line-height:1.3;
}

.nav-item.active .nav-text { color:var(--ink); }

.aside-footer {
  margin-top:auto;
  padding:1.25rem 1.5rem;
  border-top:1px solid var(--rule);
  font-family:'Inconsolata',monospace;
  font-size:10px;
  color:var(--ink3);
  letter-spacing:.04em;
  line-height:1.6;
}

/* ── Main ── */
.main {
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.top-bar {
  background:var(--surface);
  border-bottom:1px solid var(--rule);
  padding:.9rem 2.5rem;
  display:flex;
  align-items:center;
  gap:1rem;
  position:sticky;
  top:0;
  z-index:5;
}

.top-bar-title {
  font-family:'Playfair Display',serif;
  font-size:16px;
  font-style:italic;
  color:var(--ink2);
}

.top-bar-cat {
  font-family:'Inconsolata',monospace;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:3px 10px;
  border-radius:20px;
  border:1px solid var(--rule);
  color:var(--ink3);
}

.spacer{flex:1}

.copy-btn {
  font-family:'Inconsolata',monospace;
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:6px 16px;
  border-radius:4px;
  border:1px solid var(--accent-border);
  background:var(--accent-dim);
  color:var(--accent);
  cursor:pointer;
  transition:all .15s;
}
.copy-btn:hover { background:rgba(232,168,106,0.2); }
.copy-btn.copied { background:var(--green-dim); border-color:rgba(110,201,154,0.4); color:var(--green); }

.content {
  flex:1;
  padding:2rem 2.5rem 4rem;
  max-width:820px;
}

/* ── Fields section ── */
.fields-section {
  margin-bottom:2rem;
}

.fields-heading {
  font-family:'Inconsolata',monospace;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:.75rem;
}

.fields-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}

.field-group {
  display:flex;
  flex-direction:column;
  gap:4px;
}

.field-label {
  font-family:'Inconsolata',monospace;
  font-size:10px;
  color:var(--ink3);
  letter-spacing:.06em;
}

.field-group input,
.field-group select {
  font-family:'Epilogue',sans-serif;
  font-size:13px;
  padding:7px 10px;
  background:var(--surface2);
  border:1px solid var(--rule);
  border-radius:5px;
  color:var(--ink);
  transition:border-color .15s;
  outline:none;
}

.field-group input:focus,
.field-group select:focus {
  border-color:rgba(232,168,106,0.5);
}

.field-group select option { background:var(--surface2); }

/* ── Preview ── */
.preview-section { margin-bottom:1.5rem; }

.preview-heading {
  font-family:'Inconsolata',monospace;
  font-size:9px;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--ink3);
  margin-bottom:.75rem;
  display:flex;
  align-items:center;
  gap:8px;
}

.preview-heading::after {
  content:'';
  flex:1;
  height:1px;
  background:var(--rule);
}

.subject-preview {
  background:var(--surface2);
  border:1px solid var(--rule);
  border-bottom:none;
  border-radius:6px 6px 0 0;
  padding:.6rem 1rem;
  font-size:13px;
  color:var(--ink2);
  display:flex;
  gap:.5rem;
}

.subject-label {
  font-family:'Inconsolata',monospace;
  font-size:11px;
  color:var(--ink3);
  flex-shrink:0;
  padding-top:1px;
}

.subject-text {
  color:var(--ink);
  font-weight:500;
}

.email-preview {
  background:var(--surface2);
  border:1px solid var(--rule);
  border-radius:0 0 6px 6px;
  padding:1.5rem;
  font-size:13.5px;
  line-height:1.75;
  color:var(--ink2);
  white-space:pre-wrap;
  font-family:'Epilogue',sans-serif;
  min-height:240px;
}

.email-preview .placeholder {
  background:var(--accent-dim);
  border:1px solid var(--accent-border);
  border-radius:3px;
  padding:0 4px;
  color:var(--accent);
  font-family:'Inconsolata',monospace;
  font-size:11px;
}

/* ── Usage note ── */
.usage-note {
  background:var(--surface2);
  border:1px solid var(--rule);
  border-left:2px solid var(--accent);
  border-radius:0 5px 5px 0;
  padding:.75rem 1rem;
  font-size:12px;
  color:var(--ink3);
  line-height:1.6;
  margin-bottom:2rem;
}

.usage-note strong {
  color:var(--ink2);
  font-weight:500;
}

/* ── Empty state ── */
.empty-state {
  padding:6rem 0;
  text-align:center;
}

.empty-title {
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:26px;
  color:var(--ink3);
  margin-bottom:8px;
}

.empty-sub {
  font-family:'Inconsolata',monospace;
  font-size:11px;
  color:var(--ink3);
  letter-spacing:.06em;
}

/* scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:3px}
</style>
</head>
<body>
<div class="layout">

<aside>
  <div class="aside-header">
    <a href="dc_mission_control.html" class="back-link">← Mission Control</a>
    <div class="aside-wordmark">La Salle · DC Tools</div>
    <div class="aside-title">Email <em>library</em></div>
  </div>

  <div id="nav"></div>

  <div class="aside-footer">
    Fill the fields.<br>
    Preview updates live.<br>
    Copy and paste to send.
  </div>
</aside>

<div class="main">
  <div class="top-bar">
    <span class="top-bar-title" id="topTitle">Select a template</span>
    <span class="top-bar-cat" id="topCat"></span>
    <div class="spacer"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyEmail()" style="display:none">Copy email</button>
  </div>
  <div class="content" id="content">
    <div class="empty-state">
      <div class="empty-title">Choose a template</div>
      <div class="empty-sub">Select any template from the sidebar to get started</div>
    </div>
  </div>
</div>

</div>

<script>
const SCHOOL = 'La Salle';

const TEMPLATES = [
  {
    id: 'welcome_back',
    cat: 'semester',
    catLabel: 'Semester',
    catColor: '#E8A86A',
    title: 'Welcome back — semester intro',
    usage: 'Send at the start of each semester to both departments. Sets the tone, introduces your dual role clearly, and previews key dates.',
    fields: [
      { id: 'semester', label: 'Semester', placeholder: 'Fall 2026–27' },
      { id: 'dept', label: 'Department(s)', placeholder: 'Math & Science' },
      { id: 'meeting_date', label: 'First meeting date', placeholder: 'Monday, August 10' },
      { id: 'meeting_time', label: 'Meeting time', placeholder: '3:30 PM, Room 214' },
      { id: 'deadline_syllabi', label: 'Syllabus deadline', placeholder: 'Friday, August 14' },
    ],
    subject: (f) => `${f.semester || '[Semester]'} — Welcome back, ${f.dept || '[Dept]'}`,
    body: (f) => `Hi team,

Welcome back — I hope you had a restful break.

As a reminder, I'm serving as Department Chair for both Math and Science this year. My goal is to make sure both departments feel well-supported, that meetings are worth your time, and that the administrative side of things stays out of your way so you can focus on your students.

A few quick items to kick off ${f.semester || '[semester]'}:

📋 Syllabi due: Please send me your finalized syllabus by ${f.deadline_syllabi || '[date]'}. I'll review for consistency in grade policies, reassessment language, and late work. If anything needs a quick conversation, I'll reach out directly.

📅 First department meeting: ${f.meeting_date || '[date]'} at ${f.meeting_time || '[time]'}. I'll send an agenda 48 hours in advance. Come with any questions or concerns from the start of the year.

As always, my door (and inbox) is open. Reach out anytime for supplies, admin navigation, or just a conversation.

Looking forward to a strong semester.`
  },

  {
    id: 'syllabus_reminder',
    cat: 'semester',
    catLabel: 'Semester',
    catColor: '#E8A86A',
    title: 'Syllabus submission reminder',
    usage: 'Send 3–4 days before the deadline. Keep it short. The checklist at the bottom prevents back-and-forth.',
    fields: [
      { id: 'deadline', label: 'Deadline', placeholder: 'Friday, August 14 by 4 PM' },
      { id: 'submit_to', label: 'Submit to', placeholder: 'email or shared drive link' },
    ],
    subject: (f) => `Syllabus submission due ${f.deadline || '[date]'}`,
    body: (f) => `Hi team,

Quick reminder: syllabi are due ${f.deadline || '[date]'}. Please send them to ${f.submit_to || '[email/drive link]'}.

Before you submit, do a quick check that yours includes:

  ✓  Grading categories and weights
  ✓  Reassessment policy (language consistent with department standards)
  ✓  Late work and absent work policy
  ✓  Academic integrity expectations

If you have questions about any of the above before submitting, let me know — happy to look at a draft.`
  },

  {
    id: 'plc_agenda',
    cat: 'meetings',
    catLabel: 'Meetings',
    catColor: '#7AB5E8',
    title: 'PLC / dept meeting agenda',
    usage: 'Send 48 hours before every department meeting. Including a clear agenda up front is the single biggest driver of meeting efficiency — your survey confirmed this.',
    fields: [
      { id: 'date', label: 'Meeting date', placeholder: 'Monday, September 8' },
      { id: 'time', label: 'Time & location', placeholder: '3:30 PM — Room 214' },
      { id: 'item1', label: 'Agenda item 1', placeholder: 'Academic support check-in' },
      { id: 'item2', label: 'Agenda item 2', placeholder: 'Physics First planning update' },
      { id: 'item3', label: 'Agenda item 3 (optional)', placeholder: 'Open concerns' },
      { id: 'prep_ask', label: 'What to bring / review', placeholder: 'Your current gradebook snapshot' },
    ],
    subject: (f) => `Dept meeting agenda — ${f.date || '[date]'}`,
    body: (f) => `Hi team,

Our next department meeting is ${f.date || '[date]'} at ${f.time || '[time]'}.

Here's what we're covering:

  1.  ${f.item1 || '[Item 1]'}
  2.  ${f.item2 || '[Item 2]'}${f.item3 ? `\n  3.  ${f.item3}` : ''}

If you have something to add to the agenda, reply by ${f.date ? 'the day before' : '[day before date]'} and I'll work it in.

${f.prep_ask ? `One thing to have handy: ${f.prep_ask}.\n\n` : ''}We'll aim to be done on time. See you then.`
  },

  {
    id: 'meeting_followup',
    cat: 'meetings',
    catLabel: 'Meetings',
    catColor: '#7AB5E8',
    title: 'Meeting follow-up + action items',
    usage: 'Send within 24 hours of a meeting. Keeps accountability clear and creates a paper trail for admin.',
    fields: [
      { id: 'date', label: 'Meeting date', placeholder: 'Monday, September 8' },
      { id: 'decision1', label: 'Decision / update 1', placeholder: 'Physics First launch: targeting Fall 2027' },
      { id: 'decision2', label: 'Decision / update 2', placeholder: 'Reassessment cap: 2 per unit' },
      { id: 'action1_who', label: 'Action item 1 — owner', placeholder: 'All teachers' },
      { id: 'action1_what', label: 'Action item 1 — task', placeholder: 'Submit reassessment request forms by Friday' },
      { id: 'action2_who', label: 'Action item 2 — owner', placeholder: 'Mr. Denny' },
      { id: 'action2_what', label: 'Action item 2 — task', placeholder: 'Follow up with admin on final exam schedule' },
      { id: 'next_date', label: 'Next meeting date', placeholder: 'October 6' },
    ],
    subject: (f) => `Meeting notes + action items — ${f.date || '[date]'}`,
    body: (f) => `Hi team,

Thanks for a good meeting. Here's a quick recap.

Decisions / updates:
  • ${f.decision1 || '[Decision 1]'}
  • ${f.decision2 || '[Decision 2]'}

Action items:
  → ${f.action1_who || '[Owner]'}: ${f.action1_what || '[Task]'}
  → ${f.action2_who || '[Owner]'}: ${f.action2_what || '[Task]'}

Next meeting: ${f.next_date || '[date]'}. I'll send an agenda beforehand.

Reach out if anything needs clarification.`
  },

  {
    id: 'supply_request',
    cat: 'admin',
    catLabel: 'Admin',
    catColor: '#6EC99A',
    title: 'Supply request to admin',
    usage: 'Use when submitting supply orders on behalf of the department. Keeps requests documented and professional.',
    fields: [
      { id: 'recipient', label: 'Admin recipient', placeholder: 'Ms. [Name]' },
      { id: 'dept', label: 'Department', placeholder: 'Science' },
      { id: 'items', label: 'Items (one per line)', placeholder: 'Safety goggles (30 units)\nLab aprons (15 units)', textarea: true },
      { id: 'needed_by', label: 'Needed by', placeholder: 'September 15' },
      { id: 'justification', label: 'Brief justification', placeholder: 'Lab unit starting Week 4' },
    ],
    subject: (f) => `Supply request — ${f.dept || '[Dept]'} dept — ${f.needed_by || '[date]'}`,
    body: (f) => `Hi ${f.recipient || '[Admin]'},

I'm submitting a supply request for the ${f.dept || '[Department]'} department. We need these items by ${f.needed_by || '[date]'}.

Requested items:
${(f.items || '[list items here]').split('\n').map(l => '  • ' + l).join('\n')}

Reason: ${f.justification || '[brief justification]'}.

Please let me know if you need additional documentation or if anything needs to go through a different channel. Happy to talk through priorities if budget is a concern.
Department Chair, ${f.dept || '[Dept]'} — ${SCHOOL}`
  },

  {
    id: 'sub_plans',
    cat: 'admin',
    catLabel: 'Admin',
    catColor: '#6EC99A',
    title: 'Sub plans / coverage request',
    usage: 'When you need a substitute or coverage, this ensures all the details land in one place and nothing is missed.',
    fields: [
      { id: 'recipient', label: 'To', placeholder: 'Ms. [Name] / Sub Office' },
      { id: 'date', label: 'Date(s) of absence', placeholder: 'Thursday, October 2' },
      { id: 'periods', label: 'Periods / classes', placeholder: 'P2 Chemistry, P4 AP Chem' },
      { id: 'sub_name', label: 'Sub name (if known)', placeholder: 'Leave blank if unassigned' },
      { id: 'instructions', label: 'Key instructions', placeholder: 'Plans are on my desk. No lab work — worksheet only.', textarea: true },
    ],
    subject: (f) => `Coverage needed — ${f.date || '[date]'} — ${f.periods || '[classes]'}`,
    body: (f) => `Hi ${f.recipient || '[Admin]'},

I will be absent on ${f.date || '[date]'} and need coverage for: ${f.periods || '[classes]'}.

${f.sub_name && f.sub_name.trim() ? `Sub: ${f.sub_name}\n\n` : ''}Instructions for the sub:
${(f.instructions || '[Instructions here]').split('\n').map(l => '  ' + l).join('\n')}

I'll leave detailed plans on my desk and have notified the relevant teachers. Please reach out if anything comes up.`
  },

  {
    id: 'admin_update',
    cat: 'admin',
    catLabel: 'Admin',
    catColor: '#6EC99A',
    title: 'Department update to admin',
    usage: 'Monthly or quarterly summary sent up to admin. Keeps you visible and proactive — frames your work rather than letting admin define it.',
    fields: [
      { id: 'period', label: 'Period covered', placeholder: 'September 2026' },
      { id: 'recipient', label: 'Admin recipient', placeholder: 'Principal [Name]' },
      { id: 'highlight1', label: 'Highlight 1', placeholder: 'Physics First planning session completed' },
      { id: 'highlight2', label: 'Highlight 2', placeholder: 'Academic support utilization up 18%' },
      { id: 'concern', label: 'Concern / ask (optional)', placeholder: 'Request for student behavior data report' },
    ],
    subject: (f) => `Dept update — Math & Science — ${f.period || '[period]'}`,
    body: (f) => `Hi ${f.recipient || '[Admin]'},

Here's a brief department update for ${f.period || '[period]'}.

Highlights:
  • ${f.highlight1 || '[Highlight 1]'}
  • ${f.highlight2 || '[Highlight 2]'}
${f.concern ? `\nOne item to flag:\n  ${f.concern}\n` : ''}
Happy to discuss any of this further. I'll send another update at the end of next month.`
  },

  {
    id: 'start_stop_keep',
    cat: 'feedback',
    catLabel: 'Feedback',
    catColor: '#E87A9A',
    title: 'Start / Stop / Keep survey',
    usage: 'Send quarterly. Three questions only — keeping it short gets better response rates. Your teachers responded to this format well.',
    fields: [
      { id: 'period', label: 'Period / term', placeholder: 'end of Q1, October 2026' },
      { id: 'deadline', label: 'Response deadline', placeholder: 'Friday, October 17' },
      { id: 'form_link', label: 'Google Form link', placeholder: 'https://forms.gle/...' },
    ],
    subject: (f) => `Quick check-in — ${f.period || '[period]'} — 3 questions`,
    body: (f) => `Hi team,

We're at the ${f.period || '[end of term]'} mark — a good moment to check in. I have three questions and it takes about 3 minutes.

➜ ${f.form_link || '[Google Form link here]'}

The questions are:
  1.  What's one thing I should start doing to better support you?
  2.  What's one thing I should stop doing (or do less of)?
  3.  What's one thing that's currently working well I should continue?

Responses are anonymous. Deadline: ${f.deadline || '[date]'}. I'll share a summary (no attribution) at our next meeting.

I take this seriously — thank you in advance.`
  },

  {
    id: 'reassessment_policy',
    cat: 'feedback',
    catLabel: 'Feedback',
    catColor: '#E87A9A',
    title: 'Reassessment policy reminder',
    usage: 'Send at the start of each semester and after any policy update. Ensures every teacher has the same language and students get consistent information.',
    fields: [
      { id: 'dept', label: 'Department', placeholder: 'Chemistry / Science' },
      { id: 'max_reassess', label: 'Max reassessments per unit', placeholder: '2' },
      { id: 'request_window', label: 'Request window', placeholder: 'within 5 school days of grade posting' },
      { id: 'score_policy', label: 'Score replacement policy', placeholder: 'Higher score replaces original' },
      { id: 'deadline', label: 'Any clarification deadline', placeholder: 'August 28' },
    ],
    subject: (f) => `Reassessment policy — ${f.dept || '[Dept]'} — please review`,
    body: (f) => `Hi team,

Here's a reminder of our agreed reassessment policy for ${f.dept || '[Department]'} this semester. Please make sure your syllabus language matches this exactly so students get consistent information across classes.

Policy summary:
  • Maximum reassessments per unit: ${f.max_reassess || '[#]'}
  • Student request window: ${f.request_window || '[window]'}
  • Score replacement: ${f.score_policy || '[policy]'}

Students must use the formal request process — informal asks to teachers don't count.

If you have questions or want to discuss the policy before the semester gets going, let me know by ${f.deadline || '[date]'}. After that, I'll assume everyone is aligned.`
  },

  {
    id: 'concern_followup',
    cat: 'sensitive',
    catLabel: 'Sensitive',
    catColor: '#C8B89A',
    title: 'Teacher concern follow-up',
    usage: 'Use when you need to follow up with a teacher about a concern — student complaint, policy inconsistency, or classroom issue. Tone is collaborative, not punitive.',
    fields: [
      { id: 'teacher', label: 'Teacher name', placeholder: 'Mr. / Ms. [Name]' },
      { id: 'topic', label: 'Topic (vague is fine)', placeholder: 'a grading concern raised this week' },
      { id: 'meeting_ask', label: 'Meeting time ask', placeholder: 'sometime this week — 10 minutes is enough' },
    ],
    subject: (f) => `Quick check-in — ${f.topic || '[topic]'}`,
    body: (f) => `Hi ${f.teacher || '[Teacher]'},

I wanted to reach out about ${f.topic || '[topic]'}. Nothing alarming — I just want to make sure we're on the same page and that you have everything you need from my end.

Would you have time for a quick conversation? ${f.meeting_ask || '[time/format]'}. We can also do this over email if that's easier.`
  },

  {
    id: 'physics_first_update',
    cat: 'sensitive',
    catLabel: 'Sensitive',
    catColor: '#C8B89A',
    title: 'Physics First planning update',
    usage: 'Use to communicate planning decisions and next steps around Physics First. Keeps the team informed, prevents rumor, and documents the process.',
    fields: [
      { id: 'update', label: 'Where things stand', placeholder: 'We have a target launch of Fall 2027' },
      { id: 'next_step', label: 'Next concrete step', placeholder: 'School visit to [School] on October 15' },
      { id: 'input_ask', label: 'What input you need', placeholder: 'Which prep courses need the most lead time?' },
      { id: 'deadline', label: 'Response needed by', placeholder: 'October 10' },
    ],
    subject: (f) => `Physics First — planning update`,
    body: (f) => `Hi Science team,

A quick update on Physics First planning.

Where we stand: ${f.update || '[current status]'}.

Next step: ${f.next_step || '[next concrete action]'}.

I want your input before we move further: ${f.input_ask || '[question for team]'}. Please send me your thoughts by ${f.deadline || '[date]'} — even a quick reply counts.

We're doing this deliberately, not quickly. I'll keep you posted at every stage.`
  },
];

const CATS = [
  { id: 'semester', label: 'Semester', color: '#E8A86A' },
  { id: 'meetings', label: 'Meetings', color: '#7AB5E8' },
  { id: 'admin', label: 'Admin', color: '#6EC99A' },
  { id: 'feedback', label: 'Feedback', color: '#E87A9A' },
  { id: 'sensitive', label: 'Sensitive', color: '#C8B89A' },
];

let activeId = null;
let fieldValues = {};

function buildNav() {
  const nav = document.getElementById('nav');
  let html = '';
  for (const cat of CATS) {
    const items = TEMPLATES.filter(t => t.cat === cat.id);
    html += `<div class="cat-group">
      <div class="cat-label">${cat.label}</div>`;
    for (const t of items) {
      html += `<div class="nav-item" id="nav_${t.id}" onclick="selectTemplate('${t.id}')">
        <div class="nav-dot" style="background:${cat.color};opacity:0.7"></div>
        <div class="nav-text">${t.title}</div>
      </div>`;
    }
    html += `</div>`;
  }
  nav.innerHTML = html;
}

function selectTemplate(id) {
  activeId = id;
  fieldValues = {};
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav_' + id).classList.add('active');

  const tmpl = TEMPLATES.find(t => t.id === id);
  const cat = CATS.find(c => c.id === tmpl.cat);

  document.getElementById('topTitle').textContent = tmpl.title;
  document.getElementById('topCat').textContent = cat.label;
  document.getElementById('topCat').style.color = cat.color;
  document.getElementById('topCat').style.borderColor = cat.color + '44';
  document.getElementById('copyBtn').style.display = '';

  renderContent(tmpl);
}

function renderContent(tmpl) {
  const content = document.getElementById('content');

  let fieldsHtml = `<div class="fields-section">
    <div class="fields-heading">Fill in the details</div>
    <div class="fields-grid">`;

  for (const f of tmpl.fields) {
    const val = fieldValues[f.id] || '';
    if (f.textarea) {
      fieldsHtml += `<div class="field-group" style="grid-column:1/-1">
        <div class="field-label">${f.label}</div>
        <textarea id="field_${f.id}" placeholder="${f.placeholder || ''}"
          oninput="onFieldChange('${f.id}', this.value)"
          style="font-family:'Epilogue',sans-serif;font-size:13px;padding:7px 10px;background:var(--surface2);border:1px solid var(--rule);border-radius:5px;color:var(--ink);resize:vertical;min-height:72px;outline:none;width:100%;transition:border-color .15s"
          onfocus="this.style.borderColor='rgba(232,168,106,0.5)'"
          onblur="this.style.borderColor='var(--rule)'"
        >${val}</textarea>
      </div>`;
    } else {
      fieldsHtml += `<div class="field-group">
        <div class="field-label">${f.label}</div>
        <input type="text" id="field_${f.id}" placeholder="${f.placeholder || ''}" value="${val}"
          oninput="onFieldChange('${f.id}', this.value)" />
      </div>`;
    }
  }

  fieldsHtml += `</div></div>`;

  const usageHtml = `<div class="usage-note"><strong>When to use:</strong> ${tmpl.usage}</div>`;

  content.innerHTML = fieldsHtml + usageHtml + `
    <div class="preview-section">
      <div class="preview-heading">Live preview</div>
      <div class="subject-preview">
        <span class="subject-label">Subject</span>
        <span class="subject-text" id="subjectOut"></span>
      </div>
      <div class="email-preview" id="bodyOut"></div>
    </div>`;

  updatePreview();
}

function onFieldChange(id, val) {
  fieldValues[id] = val;
  updatePreview();
}

function getFields() {
  const tmpl = TEMPLATES.find(t => t.id === activeId);
  const out = {};
  for (const f of tmpl.fields) {
    out[f.id] = fieldValues[f.id] !== undefined ? fieldValues[f.id] : '';
  }
  return out;
}

function updatePreview() {
  if (!activeId) return;
  const tmpl = TEMPLATES.find(t => t.id === activeId);
  const fields = getFields();

  document.getElementById('subjectOut').textContent = tmpl.subject(fields);

  const body = tmpl.body(fields);
  // highlight any remaining [brackets]
  const escaped = body.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const highlighted = escaped.replace(/\[([^\]]+)\]/g,
    '<span class="placeholder">[$1]</span>');
  document.getElementById('bodyOut').innerHTML = highlighted;
}

function copyEmail() {
  if (!activeId) return;
  const tmpl = TEMPLATES.find(t => t.id === activeId);
  const fields = getFields();
  const subject = tmpl.subject(fields);
  const body = tmpl.body(fields);
  const full = 'Subject: ' + subject + '\n\n' + body;

  navigator.clipboard.writeText(full).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy email';
      btn.classList.remove('copied');
    }, 2200);
  });
}

/* ── Agenda handoff from the Meeting Tool ── */
function checkHandoff(){
  const params=new URLSearchParams(location.search);
  if(params.get('from')!=='agenda')return;
  let h=null;
  try{h=JSON.parse(localStorage.getItem('dc_agenda_handoff'));}catch{}
  if(!h||!h.body)return;

  // Open the PLC agenda template and prefill from the handoff
  selectTemplate('plc_agenda');
  fieldValues={
    date:     h.datetime || '',
    time:     h.location ? `${h.datetime||''}${h.location?' — '+h.location:''}`.replace(/^ — /,'') : (h.datetime||''),
    item1:    h.items[0] || '',
    item2:    h.items[1] || '',
    item3:    h.items[2] || '',
    prep_ask: h.prep || ''
  };
  renderContent(TEMPLATES.find(t=>t.id==='plc_agenda'));

  // Banner offering the full generated agenda
  const banner=document.createElement('div');
  banner.style.cssText="background:var(--surface2);border:1px solid var(--accent-border);border-left:2px solid var(--accent);border-radius:5px;padding:.75rem 1rem;margin-bottom:1.25rem;font-size:12px;color:var(--ink2);line-height:1.6";
  banner.innerHTML=`<strong style="color:var(--accent)">Agenda received from the Meeting Tool.</strong><br>
    Fields below are prefilled. <button onclick="useFullAgenda()" style="font-family:'Inconsolata',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent-dim);border:1px solid var(--accent-border);color:var(--accent);padding:4px 10px;border-radius:3px;cursor:pointer;margin-top:6px">Use the full timed agenda instead</button>`;
  document.getElementById('content').prepend(banner);

  history.replaceState({},'',location.pathname);
}

function useFullAgenda(){
  let h=null;
  try{h=JSON.parse(localStorage.getItem('dc_agenda_handoff'));}catch{}
  if(!h)return;
  const full=`Hi team,\n\nHere's the agenda for our upcoming meeting:\n\n${h.body}\n\nIf you have something to add to the agenda, reply and let me know.`;
  navigator.clipboard.writeText(full).then(()=>{
    const b=document.getElementById('copyBtn');
    b.textContent='✓ Full agenda copied';
    b.classList.add('copied');
    setTimeout(()=>{b.textContent='Copy email';b.classList.remove('copied');},2400);
  });
}

buildNav();
checkHandoff();
</script>
</body>
</html>
