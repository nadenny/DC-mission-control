<!DOCTYPE html>
<html lang="en" data-dc="report">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080C14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>DC Weekly Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Outfit:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
/* Read-only page: builds a weekly summary from what every tool saved on this
   device. It never writes anything. Print → "Save as PDF" for a copy. */
:root{
  --bg:#080C14; --bg2:#0C1220; --bg3:#111827; --border2:rgba(255,255,255,.12);
  --ink:#E8EDF5; --ink2:#8A97B0; --ink3:#6B7A93; --gold:#F5C842; --gold-dim:rgba(245,200,66,.12);
  --paper:#FFFFFF; --pink:#1F2937; --pink2:#4B5563; --pink3:#9CA3AF; --rule:#E5E7EB;
  --accent:#B7791F; --red:#B91C1C; --amber:#C2410C; --green:#15803D;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:.7rem 1.25rem;background:var(--bg2);border-bottom:1px solid var(--border2)}
.bar a.back{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);text-decoration:none;
  border:1px solid var(--border2);border-radius:4px;padding:5px 10px}
.bar .logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em;color:var(--gold);margin-right:auto}
.bar label{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.bar select,.bar input[type=date]{font:inherit;font-size:12px;background:var(--bg3);color:var(--ink);border:1px solid var(--border2);border-radius:4px;padding:5px 8px}
.bar button{font:500 12px 'Outfit',sans-serif;background:var(--gold);color:#111;border:0;border-radius:5px;padding:7px 14px;cursor:pointer}
.wrap{padding:1.25rem 16px 3rem;display:flex;justify-content:center}
.paper{background:var(--paper);color:var(--pink);width:100%;max-width:820px;border-radius:6px;padding:40px 48px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paper h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:34px;letter-spacing:.04em;color:#111}
.paper .sub{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.08em;color:var(--pink3);text-transform:uppercase;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 6px}
.kpi{border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-weight:600;color:#111;line-height:1.1}
.kpi span{font-size:11px;color:var(--pink2)}
.paper h2{font-family:'Share Tech Mono',monospace;font-weight:400;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--rule)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--pink2);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--rule)}
td{padding:6px;border-bottom:1px solid #F3F4F6;vertical-align:top}
.none{font-size:12.5px;color:var(--pink3);font-style:italic}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);white-space:nowrap}
.pill.red{color:var(--red);border-color:#FECACA;background:#FEF2F2}
.pill.amber{color:var(--amber);border-color:#FED7AA;background:#FFF7ED}
.pill.green{color:var(--green);border-color:#BBF7D0;background:#F0FDF4}
ul.plain{list-style:none;font-size:12.5px}
ul.plain li{padding:4px 0;border-bottom:1px solid #F3F4F6}
.muted{color:var(--pink3)}
.foot{margin-top:28px;font-size:10.5px;color:var(--pink3);font-family:'Share Tech Mono',monospace;letter-spacing:.04em}
@media (max-width:640px){ .paper{padding:24px 18px} .kpis{grid-template-columns:repeat(2,1fr)} table{font-size:12px} }
@media print{
  @page{margin:14mm}
  body{background:#fff}
  .bar{display:none}
  .wrap{padding:0}
  .paper{box-shadow:none;max-width:none;padding:0;border-radius:0}
  h2{break-after:avoid} tr{break-inside:avoid}
}
</style>
<link rel="stylesheet" href="dc_theme.css">
</head>
<body>
<div class="bar">
  <a class="back" href="dc_mission_control.html">← Mission Control</a>
  <div class="logo">Weekly Report</div>
  <label>Week
    <select id="wkSel" onchange="build()"></select>
  </label>
  <label><input type="checkbox" id="fullNames" onchange="build()"> Full student names</label>
  <button onclick="window.print()">Save as PDF</button>
</div>
<div class="wrap"><div class="paper" id="paper"></div></div>

<script>
const DAY=86400000;
function J(k,def){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?def:v; }catch{ return def; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function ymd(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function nice(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
/* Turn whatever date a record has into a Date (ISO string, yyyy-mm-dd, ms, "Nov 3, 2026") */
function toDate(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return new Date(v);
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return new Date(v+'T12:00:00');
  const d=new Date(v); return isNaN(d)?null:d;
}
function inRange(d,a,b){ return d&&d>=a&&d<b; }
function initials(name){
  if(document.getElementById('fullNames').checked)return name||'';
  return String(name||'').split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()+'.').join(' ');
}
function trunc(s,n){ s=String(s||'').replace(/\s+/g,' ').trim(); return s.length>n?s.slice(0,n-1)+'…':s; }

/* Week picker: this week and the previous 7 */
(function(){
  const sel=document.getElementById('wkSel'), m=mondayOf(new Date());
  for(let i=0;i<8;i++){
    const a=new Date(m.getTime()-i*7*DAY), b=new Date(a.getTime()+6*DAY);
    const o=document.createElement('option');
    o.value=ymd(a); o.textContent=(i===0?'This week · ':i===1?'Last week · ':'')+nice(a)+' – '+nice(b);
    sel.appendChild(o);
  }
  const want=new URLSearchParams(location.search).get('week');
  if(want)sel.value=want;
})();

function build(){
  const a=new Date(document.getElementById('wkSel').value+'T00:00:00');
  const b=new Date(a.getTime()+7*DAY);
  const todos=J('dc_mc_todos_v1',[]), ooLog=J('dc_oo_log_v1',{}), roster=J('dc_roster_v1',[]);
  const cases=J('dc_concern_log_v2',[]), archive=J('dc_meeting_archive_v1',[]), people=J('dc_people_log_v1',[]);
  const plc=J('dc_plc_flags_v1',null);

  // ── 1:1s ──
  const ooThisWeek=Object.entries(ooLog).filter(([d])=>inRange(toDate(d),a,b)).sort();
  const lastOO={};
  Object.entries(ooLog).forEach(([d,p])=>{ if(toDate(d)<b&&(!lastOO[p]||d>lastOO[p]))lastOO[p]=d; });
  const overdue=roster.map(r=>r.name).filter(Boolean).map(n=>({n,last:lastOO[n]}))
    .filter(x=>!x.last||(b-toDate(x.last))/DAY>21)
    .sort((x,y)=>String(x.last||'').localeCompare(String(y.last||'')));

  // ── concerns ──
  const caseDate=c=>toDate(c.dateReceived)||toDate(c.createdAt);
  const newCases=cases.filter(c=>inRange(caseDate(c),a,b));
  const resolvedCases=cases.filter(c=>inRange(toDate(c.resolvedDate),a,b));
  const openCases=cases.filter(c=>c.status!=='resolved'&&caseDate(c)&&caseDate(c)<b);
  const aging=openCases.filter(c=>(b-caseDate(c))/DAY>14).sort((x,y)=>caseDate(x)-caseDate(y));

  // ── meetings / people log ──
  const mtgs=archive.filter(m=>inRange(toDate(m.savedAt)||toDate(m.dateLabel),a,b));
  const notes=people.filter(p=>inRange(toDate(p.date)||toDate(p.savedAt),a,b))
    .sort((x,y)=>String(x.person).localeCompare(String(y.person)));

  // ── tasks ──
  const addedTasks=todos.filter(t=>inRange(toDate(t.createdAt),a,b));
  const openHigh=todos.filter(t=>!t.done&&t.pri==='high');
  const openAll=todos.filter(t=>!t.done);

  const statusPill=s=>{
    const m={open:['Open','amber'],'in-progress':['In progress','amber'],escalated:['Escalated','red'],resolved:['Resolved','green']}[s]||[s||'—',''];
    return `<span class="pill ${m[1]}">${esc(m[0])}</span>`;
  };
  const caseRow=c=>`<tr><td class="muted">${esc(c.id)}</td><td>${esc(initials(c.student))}</td><td>${esc(c.teacher||'')}</td>
    <td>${esc(c.type||'')}</td><td>${esc(trunc(c.summary,80))}</td><td>${statusPill(c.status)}</td></tr>`;
  const caseHead='<tr><th>Case</th><th>Student</th><th>Teacher</th><th>Type</th><th>Summary</th><th>Status</th></tr>';

  let h=`<h1>Department Weekly Report</h1>
    <div class="sub">La Salle · Math &amp; Science · Week of ${nice(a)} – ${nice(new Date(b.getTime()-DAY))}, ${a.getFullYear()}</div>
    <div class="kpis">
      <div class="kpi"><b>${ooThisWeek.length}</b><span>1:1 conversations</span></div>
      <div class="kpi"><b>${newCases.length}</b><span>new concerns · ${resolvedCases.length} resolved</span></div>
      <div class="kpi"><b>${mtgs.length}</b><span>meetings logged</span></div>
      <div class="kpi"><b>${openAll.length}</b><span>open tasks · ${openHigh.length} high</span></div>
    </div>`;

  h+=`<h2>1:1 conversations this week</h2>`+(ooThisWeek.length
    ?`<ul class="plain">${ooThisWeek.map(([d,p])=>`<li><span class="muted">${esc(nice(toDate(d)))}</span> · ${esc(p)}</li>`).join('')}</ul>`
    :`<p class="none">None logged this week.</p>`);
  if(overdue.length)h+=`<p style="font-size:12.5px;margin-top:8px"><b>Due for a 1:1</b> (none in 3+ weeks): `+
    overdue.map(x=>`${esc(x.n)} <span class="muted">(${x.last?'last '+esc(nice(toDate(x.last))):'never'})</span>`).join(', ')+`</p>`;

  h+=`<h2>New concerns</h2>`+(newCases.length?`<table>${caseHead}${newCases.map(caseRow).join('')}</table>`:`<p class="none">No new concerns this week.</p>`);
  if(resolvedCases.length)h+=`<h2>Resolved this week</h2><table>${caseHead}${resolvedCases.map(caseRow).join('')}</table>`;
  h+=`<h2>Open concerns older than 2 weeks</h2>`+(aging.length?`<table>${caseHead}${aging.map(caseRow).join('')}</table>`:`<p class="none">Nothing aging — every open case is under two weeks old.</p>`);

  h+=`<h2>Meetings</h2>`+(mtgs.length
    ?`<ul class="plain">${mtgs.map(m=>`<li><b>${esc(m.type||'Meeting')}</b> · ${esc(m.dateLabel||'')} <span class="muted">${esc(trunc(m.notesText||m.agendaText||'',110))}</span></li>`).join('')}</ul>`
    :`<p class="none">No meetings saved this week.</p>`);

  // ── email (only what the home page loaded in this tab; never stored) ──
  let gm=null; try{ gm=JSON.parse(sessionStorage.getItem('dc_gmail_session_v1')); }catch{}
  if(gm){
    const got=(gm.recent||[]).filter(e=>inRange(toDate(e.when),a,b));
    const senders={}; got.forEach(e=>{ senders[e.from]=(senders[e.from]||0)+1; });
    const top=Object.entries(senders).sort((x,y)=>y[1]-x[1]).slice(0,5);
    const needs=gm.needs||[];
    h+=`<h2>Email</h2><p style="font-size:12.5px">${got.length?`<b>${got.length}</b> emails received this week${(gm.recent||[]).length>=50?' (at least)':''}`+(top.length?` · most from ${top.map(([n,c])=>`${esc(n)} (${c})`).join(', ')}`:''):'No inbox email in this week from the last 14 days loaded.'}</p>`;
    h+=needs.length?`<p style="font-size:12.5px;margin-top:8px"><b>${needs.length}</b> still ${esc(gm.filter||'marked')}:</p><table><tr><th>From</th><th>Subject</th><th>Date</th></tr>${needs.slice(0,10).map(e=>
        `<tr><td>${esc(e.from)}</td><td>${esc(trunc(e.subject,80))}</td><td class="muted">${esc(nice(new Date(e.when)))}</td></tr>`).join('')}</table>`
      :`<p class="none">Nothing waiting for a reply.</p>`;
  }else if(localStorage.getItem('dc_gmail_on_v1')){
    h+=`<h2>Email</h2><p class="none">To include email, click Refresh in “Needs reply” on the home page, then open this report from there (same tab).</p>`;
  }

  h+=`<h2>Teacher notes (people log)</h2>`+(notes.length
    ?`<table><tr><th>Teacher</th><th>Type</th><th>Note</th></tr>${notes.map(p=>`<tr><td>${esc(p.person)}</td><td class="muted">${esc(p.cat||'')}</td><td>${esc(trunc(p.text,140))}</td></tr>`).join('')}</table>`
    :`<p class="none">No teacher notes this week.</p>`);

  if(plc&&Array.isArray(plc.teachers)&&plc.teachers.length){
    const rows=plc.teachers.filter(t=>(t.flags||[]).length)
      .sort((x,y)=>(y.flags.length)-(x.flags.length));
    h+=`<h2>PLC grade flags <span class="muted" style="letter-spacing:.04em;text-transform:none">· from export ${esc(plc.batch||'')}</span></h2>`+(rows.length
      ?`<table><tr><th>Teacher</th><th>Flags</th></tr>${rows.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.flags.slice(0,4).map(f=>
          `<span class="pill ${f.level==='high'?'red':'amber'}">${esc(f.course?f.course+': ':'')}${esc(trunc(f.text,70))}</span>`).join(' ')}${t.flags.length>4?` <span class="muted">+${t.flags.length-4} more</span>`:''}</td></tr>`).join('')}</table>`
      :`<p class="none">No teachers flagged in the latest PLC export.</p>`);
  }

  h+=`<h2>Open high-priority tasks</h2>`+(openHigh.length
    ?`<ul class="plain">${openHigh.map(t=>`<li>${esc(t.text)}</li>`).join('')}</ul>`:`<p class="none">No high-priority tasks open.</p>`);
  if(addedTasks.length)h+=`<p style="font-size:12px;margin-top:6px" class="muted">${addedTasks.length} task${addedTasks.length>1?'s':''} added this week.</p>`;

  h+=`<div class="foot">Generated ${new Date().toLocaleString()} from DC Mission Control on this device.${document.getElementById('fullNames').checked?'':' Student names shown as initials.'}</div>`;
  document.getElementById('paper').innerHTML=h;
}
build();
</script>
</body>
</html>
